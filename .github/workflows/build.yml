name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 MSYS2 / MinGW-w64 工具链
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: 编译（图标 + 资源 + 主程序）
        shell: cmd
        run: |
          where gcc
          where windres
          mkdir build
          gcc -O2 -s make_icon.c -o build\make_icon.exe
          pushd build
          .\make_icon.exe
          popd
          move /y build\app.ico app.ico
          windres --include-dir . app.rc -O coff -o build\app.res
          gcc -O2 -s -mwindows -fno-ident -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--nxcompat -Wl,--dynamicbase buckshot_counter.c build\app.res -o BuckshotCounter.exe -lgdi32 -luser32 -lkernel32 -static

      - name: 检查产物并计算校验值
        shell: pwsh
        run: |
          if (-not (Test-Path BuckshotCounter.exe)) { throw "编译产物不存在" }
          $f = Get-Item BuckshotCounter.exe
          Write-Host ("BuckshotCounter.exe: {0:N0} bytes" -f $f.Length)
          (Get-FileHash BuckshotCounter.exe -Algorithm SHA256).Hash | Tee-Object -FilePath SHA256.txt
          Get-Content SHA256.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: BuckshotCounter
          path: |
            BuckshotCounter.exe
            SHA256.txt
